<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Индекс Апостилей | Case Macheret</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🗺️ ИНДЕКС АПОСТИЛЕЙ</h1>
    <div id="apostille-table-container">
        <table id="apostille-table">
            <thead>
                <tr>
                    <th>№</th>
                    <th>Код безопасности</th>
                    <th>Выпуск</th>
                    <th>Апостиль</th>
                    <th>Серия/Дело</th>
                    <th>Подписант</th>
                    <th>Должность</th>
                    <th>Департамент</th>
                    <th>Архив</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <script src="script.js"></script>
    <script>
    /**
     * CASE-MACHERET Evidence Tracking System v2.2
     * Мониторинг обращений к узлам архива
     */
    document.addEventListener('click', function(event) {
        const target = event.target.closest('a');
        if (target) {
            const timestamp = new Date().toLocaleString();
            const linkHref = target.getAttribute('href');
            const linkText = target.innerText.trim() || "Unknown Node";
            const browserInfo = navigator.userAgent; 
            const pseudoHash = Math.random().toString(16).substring(2, 10).toUpperCase();

            const logEntry = `[${timestamp}] ACCESS_GRANTED [ID:${pseudoHash}]\nNode: ${linkText}\nPath: ${linkHref}\nAgent: ${browserInfo}\n-----------------------------------------------`;
            console.log('%c' + logEntry, 'color: #00ff41; background: #0a0a0a; font-family: monospace; padding: 5px;');
        }
    });
    </script>
</body>
</html>
