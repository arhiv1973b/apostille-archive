<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Индекс Апостилей | Case Macheret</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🗺️ ИНДЕКС АПОСТИЛЕЙ</h1>
    <div id="apostille-table-container">
        <table id="apostille-table">
            <thead>
                <tr>
                    <th>№</th>
                    <th>Код безопасности</th>
                    <th>Выпуск</th>
                    <th>Апостиль</th>
                    <th>Серия/Дело</th>
                    <th>Подписант</th>
                    <th>Должность</th>
                    <th>Департамент</th>
                    <th>Архив</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <script src="script.js"></script>
    <script>
    document.addEventListener('click', function(event) {
        const target = event.target.closest('a');
        if (target) {
            const log = `[${new Date().toLocaleString()}] NODE_ACCESS: ${target.innerText.trim()} | Agent: ${navigator.userAgent}`;
            console.log('%c' + log, 'color: #00ff41; background: #000; font-family: monospace;');
        }
    });
    </script>
</body>
</html>
