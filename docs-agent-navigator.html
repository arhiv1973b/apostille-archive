var cv=document.getElementById('tc'),cx=cv.getContext('2d'),ta=null,tact=false;
function tunnel(cb){
  if(tact){cb&&cb();return;}tact=true;
  var ov=document.getElementById('tov'),lb=document.getElementById('tl');
  ov.classList.add('on');lb.classList.add('on');

  function fr(){
    cx.clearRect(0,0,W,H);cx.fillStyle='rgba(10,14,23,.88)';cx.fillRect(0,0,W,H);
    for(var i=0;i<16;i++){var p=((i/16)+(t*.04))%1,r=Math.pow(p,1.5)*Math.min(W,H)*.8,a=(1-p)*.6;
      cx.beginPath();
      for(var s=0;s<=6;s++){var ag=(s/6)*Math.PI*2-Math.PI/6+(t*.005);s===0?cx.moveTo(cX+r*Math.cos(ag),cY+r*Math.sin(ag)):cx.lineTo(cX+r*Math.cos(ag),cY+r*Math.sin(ag));}
      cx.strokeStyle='rgba(79,195,247,'+a+')';cx.lineWidth=.5+(1-p);cx.stroke();}
    t++;ta=requestAnimationFrame(fr);}
  fr();

function md(s){
  return '<p>'+s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')

    .replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/^---+$/gm,'<hr>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
    .replace(/^[-*] (.+)$/gm,'<li>$1</li>').replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/\n\n/g,'</p><p>')+'</p>';
}
