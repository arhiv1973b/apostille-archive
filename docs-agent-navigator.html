// ═══ TUNNEL ANIMATION ═══
const canvas=document.getElementById('tunnel-canvas'),ctx=canvas.getContext('2d');
let tAnim=null,tActive=false;
function startTunnel(cb){
  if(tActive){cb&&cb();return;}
  tActive=true;
  const ov=document.getElementById('tunnel-overlay'),lb=document.getElementById('tunnel-label');
  ov.classList.add('active');lb.classList.add('active');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2;let t=0;
  function frame(){
    ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(10,14,23,0.87)';ctx.fillRect(0,0,W,H);
    for(let i=0;i<18;i++){
      const p=((i/18)+(t*0.04))%1,r=Math.pow(p,1.5)*Math.min(W,H)*0.85,a=(1-p)*0.65;
      ctx.beginPath();
      for(let s=0;s<=6;s++){const ang=(s/6)*Math.PI*2-Math.PI/6+(t*0.005);s===0?ctx.moveTo(cx+r*Math.cos(ang),cy+r*Math.sin(ang)):ctx.lineTo(cx+r*Math.cos(ang),cy+r*Math.sin(ang));}
      ctx.strokeStyle=`rgba(79,195,247,${a})`;ctx.lineWidth=0.5+(1-p);ctx.stroke();
    }
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,60);
    g.addColorStop(0,'rgba(79,195,247,0.25)');g.addColorStop(1,'rgba(79,195,247,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    t++;tAnim=requestAnimationFrame(frame);
  }
  frame();
  setTimeout(()=>{tActive=false;cancelAnimationFrame(tAnim);ov.classList.remove('active');lb.classList.remove('active');ctx.clearRect(0,0,W,H);cb&&cb();},650);
}

// ═══ MARKDOWN PARSER ═══
function md(s){
  let h=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```[\w]*\n([\s\S]*?)```/g,'<pre><code>$1</code></pre>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/^---+$/gm,'<hr>')
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/_(.+?)_/g,'<em>$1</em>').replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
    .replace(/^\|(.+)\|$/gm,(_,row)=>{if(row.match(/^[\s\-|]+$/))return'<tr data-sep></tr>';return'<tr>'+row.split('|').map(c=>`<td>${c.trim()}</td>`).join('')+'</tr>';})
    .replace(/^\* (.+)$/gm,'<li>$1</li>').replace(/^\- (.+)$/gm,'<li>$1</li>').replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
    .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/\n\n/g,'</p><p>');
  h=h.replace(/(<tr[^>]*>.*?<\/tr>\s*)+/gs,m=>{const rows=m.split('</tr>').filter(r=>r.trim());let o='<table>';rows.forEach((r,i)=>{if(r.includes('data-sep'))return;if(i===0)o+='<thead>'+r.replace(/td>/g,'th>')+'</tr></thead><tbody>';else o+=r+'</tr>';});return o+'</tbody></table>';});
  h=h.replace(/(<li>.*?<\/li>\s*)+/gs,m=>`<ul>${m}</ul>`);
  return'<p>'+h+'</p>';
}

  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));

}

      </div>`;
    con.classList.remove('loading');return;
  }

  // Stub pages — warning + link
  if(page.status==='stub'){
    out.innerHTML=`
      <div style="text-align:center;padding:2rem">
        <div style="font-size:1.8rem;color:var(--gold);margin-bottom:0.75rem">📝</div>
        <div style="color:var(--gold);font-weight:700;margin-bottom:0.4rem;letter-spacing:1px">STUB PAGE — ТРЕБУЕТ ЗАПОЛНЕНИЯ</div>
        <div style="color:var(--muted);font-size:0.75rem;margin-bottom:1.25rem;font-family:monospace">${page.path}</div>

        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <a href="${RAW}${page.path}" target="_blank" class="meta-btn" style="border-color:var(--gold);color:var(--gold)">↗ RAW GITHUB</a>
          <a href="${SITE}${page.path}" target="_blank" class="meta-btn">↗ LIVE</a>
        </div>
      </div>`;
    con.classList.remove('loading');return;
  }

  // Raw / MD — fetch and render
  fetch(RAW+page.path)
    .then(r=>{if(!r.ok)throw new Error('404');return r.text();})
    .then(text=>{
      const ext=page.path.split('.').pop().toLowerCase();
      out.innerHTML=ext==='md'?md(text):(ext==='json'||ext==='txt'||ext==='sh')?`<pre style="white-space:pre-wrap;word-break:break-all;font-size:0.75rem">${text}</pre>`:md(text);
      con.classList.remove('loading');
    })
    .catch(()=>{
      out.innerHTML=`
        <div style="text-align:center;padding:2rem">
          <div style="font-size:1.8rem;color:var(--void);margin-bottom:0.6rem">⚠</div>
          <div style="color:var(--void);font-weight:700;margin-bottom:0.4rem">ФАЙЛ НЕ НАЙДЕН НА GITHUB</div>

}
